<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>University Course Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="sidebar">
    <h1>Course System</h1>
    <a class="nav-item active" data-section="dashboard">Dashboard</a>
    <a class="nav-item" data-section="register">Register</a>
    <a class="nav-item" data-section="addStudent">Add Student</a>
    <a class="nav-item" data-section="addCourse">Add Course</a>
    <a class="nav-item" data-section="addInstructor">Add Instructor</a>

    <div class="nav-group-label">Data</div>
    <a class="nav-item" data-section="students">Students</a>
    <a class="nav-item" data-section="courses">Courses</a>
    <a class="nav-item" data-section="instructors">Instructors</a>
</nav>

<main class="content">
    <h2 id="section-title">Dashboard</h2>

    <section id="section-dashboard" class="section-body wide">
        <div class="dashboard-cards">
            <div class="dashboard-card">
                <div class="dashboard-card-value" id="dashboardStudentsCount">0</div>
                <div class="dashboard-card-label">Students</div>
            </div>
            <div class="dashboard-card">
                <div class="dashboard-card-value" id="dashboardCoursesCount">0</div>
                <div class="dashboard-card-label">Courses</div>
            </div>
            <div class="dashboard-card">
                <div class="dashboard-card-value" id="dashboardInstructorsCount">0</div>
                <div class="dashboard-card-label">Instructors</div>
            </div>
        </div>
    </section>

    <section id="section-students" class="section-body wide" hidden>
        <div class="split-view">
            <div class="split-list">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="studentsTableBody"></tbody>
                </table>
            </div>

            <div class="split-detail" id="studentDetailView">
                <div class="empty-state">Select a student to see details.</div>
            </div>
        </div>
    </section>

    <section id="section-courses" class="section-body wide" hidden>
        <div class="split-view">
            <div class="split-list">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Title</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="coursesTableBody"></tbody>
                </table>
            </div>

            <div class="split-detail" id="courseDetailView">
                <div class="empty-state">Select a course to see details.</div>
            </div>
        </div>
    </section>

    <section id="section-instructors" class="section-body wide" hidden>
        <div class="split-view">
            <div class="split-list">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="instructorsTableBody"></tbody>
                </table>
            </div>

            <div class="split-detail" id="instructorDetailView">
                <div class="empty-state">Select an instructor to see details.</div>
            </div>
        </div>
    </section>

    <section id="section-register" class="section-body" hidden>
        <div class="form-card">
            <div class="form-group">
                <label for="registerStudentSelect">Student</label>
                <select id="registerStudentSelect">
                    <option value="">Choose a student</option>
                </select>
            </div>

            <div class="form-group">
                <label for="registerCourseSelect">Course</label>
                <select id="registerCourseSelect">
                    <option value="">Choose a course</option>
                </select>
            </div>

            <button id="registerBtn" class="btn-primary">Register</button>
            <p id="registerMessage" class="form-message"></p>
        </div>
    </section>

    <section id="section-addStudent" class="section-body" hidden>
        <div class="form-card">
            <div class="form-group">
                <label for="studentNameInput">Name</label>
                <input type="text" id="studentNameInput" placeholder="Student name">
            </div>

            <div class="form-group">
                <label for="studentEmailInput">Email</label>
                <input type="email" id="studentEmailInput" placeholder="student@example.com">
            </div>

            <div class="form-group">
                <label for="studentPhoneInput">Phone</label>
                <input type="text" id="studentPhoneInput" placeholder="01000000000">
            </div>

            <div class="form-group">
                <label for="studentAgeInput">Age</label>
                <input type="number" id="studentAgeInput" placeholder="20">
            </div>

            <button id="addStudentBtn" class="btn-primary">Add Student</button>
            <p id="addStudentMessage" class="form-message"></p>
        </div>
    </section>

    <section id="section-addCourse" class="section-body" hidden>
        <div class="form-card">
            <div class="form-group">
                <label for="courseTitleInput">Title</label>
                <input type="text" id="courseTitleInput" placeholder="Course title">
            </div>

            <div class="form-group">
                <label for="courseDescriptionInput">Description</label>
                <input type="text" id="courseDescriptionInput" placeholder="Course description">
            </div>

            <button id="addCourseBtn" class="btn-primary">Add Course</button>
            <p id="addCourseMessage" class="form-message"></p>
        </div>
    </section>

    <section id="section-addInstructor" class="section-body" hidden>
        <div class="form-card">
            <div class="form-group">
                <label for="instructorNameInput">Name</label>
                <input type="text" id="instructorNameInput" placeholder="Instructor name">
            </div>

            <div class="form-group">
                <label for="instructorEmailInput">Email</label>
                <input type="email" id="instructorEmailInput" placeholder="instructor@example.com">
            </div>

            <div class="form-group">
                <label for="instructorPhoneInput">Phone</label>
                <input type="text" id="instructorPhoneInput" placeholder="01000000000">
            </div>

            <div class="form-group">
                <label for="instructorAgeInput">Age</label>
                <input type="number" id="instructorAgeInput" placeholder="35">
            </div>

            <button id="addInstructorBtn" class="btn-primary">Add Instructor</button>
            <p id="addInstructorMessage" class="form-message"></p>
        </div>
    </section>
</main>

<div id="confirmModalOverlay" class="modal-overlay" hidden>
    <div class="modal-box">
        <p id="confirmModalMessage"></p>
        <div class="modal-actions">
            <button id="confirmModalCancel" class="btn-secondary">Cancel</button>
            <button id="confirmModalConfirm" class="btn-danger">Delete</button>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
