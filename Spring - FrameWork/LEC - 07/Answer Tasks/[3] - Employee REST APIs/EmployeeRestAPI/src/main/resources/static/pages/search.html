<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Employees</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="page-container">
    <h1>Search by Name</h1>

    <div class="search-section">
        <div class="form-group">
            <label for="searchName">Name (or starting letters)</label>
            <input type="text" id="searchName" placeholder="e.g. ahmed">
        </div>

        <div class="radio-group">
            <label>
                <input type="radio" name="searchType" value="derived" checked>
                Derived Query
            </label>
            <label>
                <input type="radio" name="searchType" value="native">
                Native Query
            </label>
            <label>
                <input type="radio" name="searchType" value="jpql">
                JPQL
            </label>
        </div>

        <button id="searchBtn" class="submit-btn">Search</button>
    </div>

    <table class="employee-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Phone Number</th>
        </tr>
        </thead>
        <tbody id="searchTableBody"></tbody>
    </table>

    <p id="emptyMessage" class="empty-message" style="display: none;">No employees found.</p>

    <a href="menu.html" class="back-link">← Back to Menu</a>
</div>

<script src="../js/search.js"></script>
</body>
</html>
