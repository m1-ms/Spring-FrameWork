<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Employee</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="page-container">
    <h1>Delete Employee</h1>

    <div class="load-section">
        <div class="form-group">
            <label for="deleteId">Employee ID</label>
            <input type="number" id="deleteId" required>
        </div>
        <button id="findBtn" class="submit-btn secondary-btn">Find</button>
    </div>

    <div id="employeeDetails" class="employee-details" style="display: none;">
        <p><strong>Name:</strong> <span id="detailName"></span></p>
        <p><strong>Age:</strong> <span id="detailAge"></span></p>
        <p><strong>Phone Number:</strong> <span id="detailPhone"></span></p>
    </div>

    <button id="deleteBtn" class="submit-btn danger-btn" style="display: none;">Delete This Employee</button>

    <p id="resultMessage" class="result-message"></p>

    <a href="menu.html" class="back-link">← Back to Menu</a>
</div>

<div id="confirmModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
        <p id="modalMessage"></p>
        <div class="modal-actions">
            <button id="modalCancelBtn" class="submit-btn secondary-btn">Cancel</button>
            <button id="modalConfirmBtn" class="submit-btn danger-btn">Yes, Delete</button>
        </div>
    </div>
</div>

<script src="../js/delete.js"></script>
</body>
</html>
