<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scoreboard-bar">
    <a href="index.html" class="back-link">← Back</a>
    <h1 class="page-title">Delete Player</h1>
</div>

<main class="page">
    <div id="pickSection"></div>

    <div class="panel panel--crimson" id="confirmPanel" style="display:none;">
        <div class="player-summary">
            <div class="name" id="pName"></div>
            <div class="sub" id="pDetails"></div>
        </div>
        <p class="msg">Are you sure you want to delete this player?</p>
        <div class="error-text" id="errorMsg" style="display:none;"></div>
        <div class="btn-row">
            <a href="index.html" class="btn btn-ghost">Cancel</a>
            <button id="confirmDeleteBtn" class="btn btn-delete">Delete</button>
        </div>
    </div>

    <div class="panel state-box" id="successBox" style="display:none;">
        <div class="state-icon">✔</div>
        <p class="msg">Player deleted successfully</p>
        <div class="btn-row">
            <a href="index.html" class="btn btn-ghost">Back</a>
            <a href="players-list.html" class="btn btn-edit">Players List</a>
        </div>
    </div>
</main>

<script>
    const params = new URLSearchParams(window.location.search);
    const playerId = params.get('id');

    const pickSection = document.getElementById('pickSection');
    const confirmPanel = document.getElementById('confirmPanel');
    const successBox = document.getElementById('successBox');
    const errorMsg = document.getElementById('errorMsg');

    if (playerId) {
        loadPlayerForConfirm(playerId);
    } else {
        loadPlayerPickList();
    }

    async function loadPlayerPickList() {
        try {
            const response = await fetch('/api/players');
            const players = await response.json();

            if (players.length === 0) {
                pickSection.innerHTML = '<p class="empty-state">No players available to delete.</p>';
                return;
            }

            pickSection.innerHTML = '<div class="data-list">' + players.map(p => `
            <a href="delete-player.html?id=${p.id}" class="data-row">
                <div class="row-info">
                    <div class="row-name"><span class="num">#${p.id}</span>${p.name}</div>
                    <div class="row-meta">${p.age} yrs · ${p.team}</div>
                </div>
                <span class="row-chevron">›</span>
            </a>
        `).join('') + '</div>';
        } catch (err) {
            pickSection.innerHTML = '<p class="empty-state">Could not load player.</p>';
        }
    }

    async function loadPlayerForConfirm(id) {
        try {
            const response = await fetch(`/api/players/${id}`);
            if (!response.ok) {
                pickSection.innerHTML = '<p class="empty-state">Player not found.</p>';
                return;
            }
            const player = await response.json();

            document.getElementById('pName').textContent = player.name;
            document.getElementById('pDetails').textContent = `${player.age} yrs · ${player.team}`;

            confirmPanel.style.display = 'block';
        } catch (err) {
            pickSection.innerHTML = '<p class="empty-state">Could not load player.</p>';
        }
    }

    document.getElementById('confirmDeleteBtn').addEventListener('click', async function () {
        errorMsg.style.display = 'none';

        try {
            const response = await fetch(`/api/players/${playerId}`, { method: 'DELETE' });

            if (response.ok) {
                confirmPanel.style.display = 'none';
                successBox.style.display = 'block';
            } else {
                errorMsg.textContent = 'Something went wrong, please try again';
                errorMsg.style.display = 'block';
            }
        } catch (err) {
            errorMsg.textContent = 'Could not reach the server';
            errorMsg.style.display = 'block';
        }
    });
</script>

</body>
</html>
